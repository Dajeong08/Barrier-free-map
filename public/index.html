<!DOCTYPE html> 
<html lang="ko"> 
<head>
  <meta charset="utf-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1" /> 
  <title>배리어프리 지도 - 포천 중심</title> 
  <link rel="stylesheet" href="./styles.css" /> 
</head>
<body> 

  <!-- 로고/로그인: 모바일·PC 공통 상단 바 (레이아웃은 CSS 미디어쿼리로만 전환) -->
  <header id="topbar">
    <div class="logo-placeholder logo-placeholder-lg"></div>
    <button class="text-link-btn" type="button">로그인</button>
  </header>

  <!-- 검색+필터 패널: 모바일에서는 위/아래로 분리되어 보이고, PC에서는 오른쪽 사이드바 하나로 합쳐짐 -->
  <div id="app-panel">
    <div id="search-card">
      <div class="route-input-group">
        <div class="route-input-wrapper">
          <div class="route-input-row">
            <span class="route-dot"></span>
            <input id="route-start-input" type="text" class="route-text-input" placeholder="출발" autocomplete="off" />
          </div>
          <ul id="route-start-suggestions" class="route-suggestions"></ul>
        </div>

        <div class="route-input-wrapper">
          <div class="route-input-row">
            <span class="route-dot"></span>
            <input id="route-end-input" type="text" class="route-text-input" placeholder="도착" autocomplete="off" />
          </div>
          <ul id="route-end-suggestions" class="route-suggestions"></ul>
        </div>

        <button id="swap-btn" class="swap-btn" type="button" aria-label="출발지와 도착지 바꾸기">
          <span class="swap-icon">⇅</span>
        </button>
      </div>

      <button id="find-route-btn" class="find-route-btn" type="button" disabled>
        길찾기 <span class="arrow">›</span>
      </button>
    </div>

    <div id="info-bar"></div>
    <div id="sidebar">
      <div class="search-box">
        <input id="place-search-input" type="text" placeholder="장소, 주소를 검색해보세요" />
        <button id="place-search-btn" type="button">검색</button>
      </div>
      <ul id="place-search-results"></ul>
    </div>

    <!-- 마커 종류별 필터: 다음 작업에서 채울 자리, 지금은 비워둠 -->
    <div id="filter-sheet">
      <div class="sheet-handle"></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="register-menu" class="register-menu"> 
    <button id="open-form-btn" type="button">신규 장소 등록</button> 
  </div>

  <section id="register-modal" class="register-modal" aria-label="신규 장소 등록"> 
    <header class="modal-header"> 
      <button id="cancel-btn" type="button">취소</button> 
      <h1>신규 장소 등록</h1> 
      <button id="save-btn" type="button">등록</button> 
    </header>

    <form id="place-form" class="modal-body">
      <label class="photo-box" for="place-photo"> 
        <img id="photo-preview" alt="선택한 장소 사진 미리보기" /> 
        <span id="photo-guide" class="photo-plus" aria-hidden="true">+</span> 
        <span id="photo-controls" class="photo-controls">
          <button id="prev-photo-btn" type="button" aria-label="이전 사진">‹</button> 
          <strong id="photo-count">1/1</strong> 
          <button id="next-photo-btn" type="button" aria-label="다음 사진">›</button> 
          <button id="delete-photo-btn" type="button">삭제</button> 
        </span> 
      </label>
      <input id="place-photo" type="file" accept="image/*" multiple /> 

      <label class="field">
        <span>장소명 <em>(필수)</em></span>
        <input id="place-name" type="text" placeholder="업체의 명칭을 입력해주세요." /> 
      </label>

      <label class="field">
        <span>기타 <em>(필수)</em></span> 
        <textarea id="place-reason" placeholder="이 장소가 왜 등록되었는지 입력해주세요. 예: 이 가게의 입구에 경사로가 없어서 등록되었다."></textarea> 
      </label>
    </form>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script> 
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script> 
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script> 
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=49e85ecac915893ebe3e89efcd4d492c&libraries=services&autoload=false"></script>
  <script src="./app.js"></script>  
</body>
</html>
